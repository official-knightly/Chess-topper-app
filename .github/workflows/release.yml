name: Chessist Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: [chessist-desktop-app]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.target }} desktop app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
                - run: npm install
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: chessist-desktop-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  browser-companion:
    name: Build browser companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
                - run: npm install
      - run: npm run build:firefox-ext
      - name: Upload browser companion
        uses: actions/upload-artifact@v4
        with:
          name: chessist-browser-companion
          path: release/firefox-extension/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish installers to GitHub Releases
    needs: [desktop, browser-companion]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Chessist ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/chessist-desktop-win/*
            release-assets/chessist-desktop-mac/*
            release-assets/chessist-desktop-linux/*
            release-assets/chessist-browser-companion/**/*
