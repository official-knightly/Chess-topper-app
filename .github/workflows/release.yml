name: Chessist Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: [chessist-desktop-app]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.target }} desktop app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm install
      - name: Build Windows overlay helper
        if: runner.os == 'Windows'
        run: npm run build:overlay
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: chessist-desktop-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish standalone desktop installers
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/chessist-desktop-app' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          target_commitish: chessist-desktop-app
          name: Chessist ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/chessist-desktop-win/*
            release-assets/chessist-desktop-mac/*
            release-assets/chessist-desktop-linux/*
