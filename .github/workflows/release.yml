name: Chess Topper Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.target }} desktop app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm install
      - name: Build Windows overlay helper
        if: runner.os == 'Windows'
        run: npm run build:overlay
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: chess-topper-desktop-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
            !release/bun-ws-worker.exe
            !release/builder-debug.yml
            !release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish standalone desktop installers
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Skip stale builds
        shell: bash
        run: |
          if [ "$GITHUB_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "A newer commit is already on main; this build must not overwrite its release."
            exit 1
          fi
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.5' }}
          target_commitish: main
          name: Chess Topper ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.5' }}
          generate_release_notes: false
          body: |
            ## Chess Topper v1.0.5

            A refreshed desktop release for Windows, macOS and Linux.

            ### What's included
            - Consistent Chess Topper branding across the desktop app and release downloads.
            - Native Stockfish analysis, live board evaluation and configurable move assistance.
            - Existing Chess.com and Lichess browser-extension integration.
            - World Chess live-board integration using the existing desktop analysis overlay.
            - Cleaner release downloads: platform installers only, with updater metadata retained for in-app updates.

            ### Lichess
            Live-board analysis and move assistance still require a Lichess game tab in a supported browser with the Chess Topper extension loaded. World Chess live-board support uses the browser extension and the existing desktop overlay.
          fail_on_unmatched_files: false
          files: |
            release-assets/chess-topper-desktop-win/*.exe
            release-assets/chess-topper-desktop-win/latest*.yml
            release-assets/chess-topper-desktop-win/*.blockmap
            release-assets/chess-topper-desktop-mac/*.dmg
            release-assets/chess-topper-desktop-mac/latest*.yml
            release-assets/chess-topper-desktop-mac/*.blockmap
            release-assets/chess-topper-desktop-linux/*.AppImage
            release-assets/chess-topper-desktop-linux/*.deb
            release-assets/chess-topper-desktop-linux/latest*.yml
                        