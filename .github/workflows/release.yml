name: Chessist Local Desktop Releases
on:
  workflow_dispatch:
  push:
    branches: [chessist-desktop-app]
    tags: ["v*"]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: chessist-local-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  browser-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run build:firefox-ext
      - uses: actions/upload-artifact@v4
        with:
          name: chessist-browser-companion
          path: release/firefox-extension/**
          if-no-files-found: error
